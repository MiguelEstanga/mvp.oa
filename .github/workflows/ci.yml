name: CI

on:
  push:
    branches: [nueva-main]
  pull_request:
    branches: [nueva-main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint (non-blocking)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true
